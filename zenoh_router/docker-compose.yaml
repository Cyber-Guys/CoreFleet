services:
  zenoh-router:
    image: eclipse/zenoh:latest
    command: ["-l", "tcp/0.0.0.0:7447", "--rest-http-port", "0.0.0.0:8000"]
    ports:
      - "7447:7447/tcp"           # Zenoh wire protocol (clients connect here)
      - "8000:8000/tcp"           # REST API (curl / browser queries)
    networks:
      - zenoh-net

  zenoh-subscriber:
    build:
      context: ./subscriber
    environment:
      ZENOH_ROUTER: tcp/zenoh-router:7447
    depends_on:
      - zenoh-router
    networks:
      - zenoh-net

networks:
  zenoh-net:
    name: zenoh-net
    external: true        # shared Docker network used by the separate publisher stack
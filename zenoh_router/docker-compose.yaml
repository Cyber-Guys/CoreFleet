# Standalone Zenoh router (router only).
# For the full stack (router + server + simulator) use the top-level
# docker-compose.yaml at the repository root instead.
services:
  zenoh-router:
    image: eclipse/zenoh:latest
    command: ["-l", "tcp/0.0.0.0:7447", "--rest-http-port", "0.0.0.0:8000"]
    ports:
      - "7447:7447/tcp"   # Zenoh wire protocol (clients connect here)
      - "8000:8000/tcp"   # REST API (curl / browser queries)
    networks:
      - corefleet

networks:
  corefleet:
    name: corefleet

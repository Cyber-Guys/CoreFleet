# Processed at container start by the nginx image's envsubst step
# (/etc/nginx/templates/*.template -> /etc/nginx/conf.d/). Upstreams are injected
# via env vars so the report service / Zenoh router can live on other machines.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA history fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin proxy to the Zenoh router REST API (ZENOH_REST_URL).
  location /fleet-api/ {
    proxy_pass ${ZENOH_REST_URL}/;
    proxy_set_header Host $host;
  }

  # Same-origin proxy to the Jakarta report service (REPORT_SERVICE_URL).
  # Long read timeout: image generation can take ~60-90 s.
  location /report-api/ {
    proxy_pass ${REPORT_SERVICE_URL}/;
    proxy_set_header Host $host;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

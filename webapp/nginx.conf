server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # hashed build assets can be cached aggressively
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA history fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: same-origin proxy to the Zenoh router REST API.
  # Set VITE_FLEET_API_URL=/fleet-api at build time to use it.
  location /fleet-api/ {
    proxy_pass http://zenoh-router:8000/;
    proxy_set_header Host $host;
  }

  # Optional: same-origin proxy to the Jakarta report service.
  # Set VITE_REPORT_API_URL=/report-api at build time to use it.
  location /report-api/ {
    proxy_pass http://fleet-report:8080/;
    proxy_set_header Host $host;
  }
}

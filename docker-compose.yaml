# CoreFleet full stack: Zenoh router + fleet server + fleet simulator.
#   docker compose up --build
# REST API is exposed on :8000 for the web app / curl inspection.
services:
  zenoh-router:
    image: eclipse/zenoh:latest
    command: ["-l", "tcp/0.0.0.0:7447", "--rest-http-port", "0.0.0.0:8000"]
    ports:
      - "7447:7447/tcp"   # Zenoh wire protocol
      - "8000:8000/tcp"   # REST API (web app / curl)
    networks:
      - corefleet

  fleet-server:
    build:
      context: .
      dockerfile: zenoh_router/subscriber/Dockerfile
    environment:
      ZENOH_ROUTER: tcp/zenoh-router:7447
      BW_LIMIT_BYTES_S: "4000"   # projected CLOUD B/s that triggers EDGE
      BW_HYSTERESIS: "0.6"       # return to CLOUD below 60% of the limit
      STATS_INTERVAL_S: "5"
      LOG_LEVEL: INFO
    depends_on:
      - zenoh-router
    networks:
      - corefleet

  fleet-simulator:
    build:
      context: .
      dockerfile: fleet_simulator/Dockerfile
    environment:
      ZENOH_ROUTER: tcp/zenoh-router:7447
      START_VEHICLES: "3"
      MAX_VEHICLES: "15"
      SPAWN_INTERVAL_S: "8"      # add a vehicle every 8s -> ramps into congestion
      DURATION_S: "300"
      LOG_LEVEL: INFO
    depends_on:
      - zenoh-router
      - fleet-server
    networks:
      - corefleet

networks:
  corefleet:
    name: corefleet

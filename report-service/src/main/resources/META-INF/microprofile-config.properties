# OpenAI / LLM configuration.
# Values come from the environment via MicroProfile Config:
#   openai.api-key     <- OPENAI_API_KEY    (required)
#   openai.model-name  <- OPENAI_MODEL_NAME
#   openai.base-url    <- OPENAI_BASE_URL
# The ${VAR:default} form supplies a fallback when the env var is unset.
openai.api-key=${OPENAI_API_KEY:}
openai.model-name=${OPENAI_MODEL_NAME:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:60}

# Hourglass image generation via the OpenAI Responses API image_generation tool.
# The model must support the Responses API (gpt-5-mini works with our key;
# gpt-4o/4.1 need org verification). Disable with OPENAI_IMAGE_ENABLED=false.
openai.image-model=${OPENAI_IMAGE_MODEL:gpt-5-mini}
openai.image-enabled=${OPENAI_IMAGE_ENABLED:true}
openai.image-timeout-seconds=${OPENAI_IMAGE_TIMEOUT_SECONDS:240}
# lower quality = faster. Size must be a gpt-image-1 value: 1024x1024 / 1024x1536 / 1536x1024.
openai.image-size=${OPENAI_IMAGE_SIZE:1024x1024}
openai.image-quality=${OPENAI_IMAGE_QUALITY:low}

# How many safety points a single fine (multa) removes from a driver's report.
report.fine-safety-penalty=${REPORT_FINE_SAFETY_PENALTY:25}
